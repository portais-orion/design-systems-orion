# Publicacao dos pacotes do Nucleo no GitHub Packages.
# Manual (workflow_dispatch), dry-run por padrao. NAO publica em push.
#
# Pre-requisitos:
#   - Repo transferido para a org portais-orion (scope == owner == @portais-orion).
#   - Confirme o scope @portais-orion e siga o runbook de distribuicao
#     (docs/architecture/package-distribution.md) ANTES do primeiro publish real.
#   - GITHUB_TOKEN do job tem `packages: write` (definido em permissions abaixo).
name: Release packages

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "So empacota (pnpm pack:all), sem publicar"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@portais-orion"

      - run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: |
          pnpm check
          pnpm typecheck
          pnpm build

      - name: Pack and inspect
        run: pnpm pack:all

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: pnpm publish:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
