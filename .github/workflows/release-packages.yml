# Publicacao dos pacotes do Orion no npm publico (registry.npmjs.org).
# Manual (workflow_dispatch), dry-run por padrao. NAO publica em push.
#
# Pre-requisitos:
#   - Secret NPM_TOKEN no repo/org: token de automacao da conta/org npm "portais-orion"
#     (https://www.npmjs.com/settings/<org>/tokens), tipo "Automation".
#   - Confirme o scope @design-systems-orion e siga o runbook de distribuicao
#     (docs/architecture/package-distribution.md) ANTES do primeiro publish real.
#   - Quality gates roda typecheck/build só em tokens/ui/blocks (o que é publicado), não no
#     monorepo inteiro: apps/docs tem um bug pre-existente e nao relacionado no
#     fumadocs-mdx (.source/server.ts sai vazio) que nao deve bloquear release dos packages.
name: Release packages

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "So empacota (pnpm pack:all), sem publicar"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@design-systems-orion"

      - run: pnpm install --frozen-lockfile

      - name: Quality gates
        run: |
          pnpm check
          pnpm exec turbo typecheck build \
            --filter=@design-systems-orion/tokens \
            --filter=@design-systems-orion/ui \
            --filter=@design-systems-orion/blocks

      - name: Pack and inspect
        run: pnpm pack:all

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: pnpm publish:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
